<head>
    <meta charset="UTF-8">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #050505;
            --bg-elevated: #0c0c0c;
            --bg-card: #111111;
            --border: #1a1a1a;
            --border-hover: #2a2a2a;
            --accent: #c9a96e;
            --accent-dim: rgba(201,169,110,0.15);
            --text: #f0f0f0;
            --text-muted: #888888;
            --text-dim: #555555;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }
        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; font-weight: 600; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }

        /* Header */
        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            padding: 1.2rem 3rem;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.4s ease;
        }
        header.scrolled {
            background: rgba(5,5,5,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 3rem;
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
        nav { display: flex; gap: 2.5rem; }
        nav a {
            color: var(--text-muted); text-decoration: none; font-size: 0.85rem;
            font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase;
            transition: color 0.3s; position: relative;
        }
        nav a::after {
            content: ''; position: absolute; bottom: -4px; left: 0;
            width: 0; height: 1px; background: var(--accent); transition: width 0.3s;
        }
        nav a:hover { color: var(--text); }
        nav a:hover::after { width: 100%; }
        .btn {
            background: var(--accent); color: var(--bg); padding: 0.7rem 1.8rem;
            border-radius: 100px; text-decoration: none; font-weight: 600;
            font-size: 0.85rem; border: none; cursor: pointer;
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 0.5rem;
            letter-spacing: 0.02em;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(201,169,110,0.25); }
        .btn-outline {
            background: transparent; color: var(--text); border: 1px solid var(--border-hover);
        }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }

        /* Hero */
        .hero {
            min-height: 100vh; position: relative; display: flex; align-items: center;
            justify-content: center; overflow: hidden;
        }
        .hero-bg {
            position: absolute; inset: 0; z-index: 0;
            background: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1920&q=80') center/cover no-repeat;
        }
        .hero-bg::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(5,5,5,0.3) 0%, rgba(5,5,5,0.7) 50%, var(--bg) 100%);
        }
        .hero-content { position: relative; z-index: 1; text-align: center; padding: 0 2rem; max-width: 900px; }
